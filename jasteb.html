 <head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> 
  <style>
        /* CSS UNTUK TAMPILAN */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: white;
            overflow: hidden;
        }

        /* Background Gambar dengan Overlay */
        .background-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('1000226888.jpg') no-repeat center center/cover;
            filter: brightness(0.5) contrast(1.2);
            z-index: -1;
        }

        /* Efek Garis Scanline (Hacker Feel) */
        .background-overlay::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        /* Animasi Glitch pada Judul */
        h1 {
            font-size: 3rem;
            letter-spacing: 8px;
            margin-bottom: 5px;
            text-shadow: 2px 2px #ff0000, -2px -2px #00ff41;
            position: relative;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            1% { transform: translate(-2px, 2px); }
            2% { transform: translate(-2px, -2px); }
            3% { transform: translate(2px, 2px); }
            4% { transform: translate(2px, -2px); }
            5% { transform: translate(0); }
            100% { transform: translate(0); }
        }

        p.subtitle {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            font-size: 11px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 8px;
            display: block;
            opacity: 0.8;
        }

        input, select {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .btn-send {
            width: 100%;
            padding: 16px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
        }

        /* Pop-up Modal */
        .modal {
            display: none; 
            position: fixed;
            z-index: 100;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            color: white;
            width: 85%;
            max-width: 320px;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .modal-content i {
            font-size: 60px;
            color: #00ff41;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
        }

        .modal-content h2 {
            font-size: 18px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .modal-content p {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 25px;
        }

        .modal-content button {
            padding: 12px 40px;
            border-radius: 30px;
            border: none;
            background: #00ff41;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        footer {
            margin-top: 30px;
            font-size: 10px;
            opacity: 0.5;
            letter-spacing: 1px;
        }
    </style>

  <script>
        // LOGIKA JAVASCRIPT
        function showSuccess() {
            const phone = document.getElementById('phone').value;
            
            if (phone === "") {
                alert("Harap masukkan nomor WhatsApp target!");
                return;
            }

            // Memunculkan Pop-up
            const modal = document.getElementById('bugModal');
            modal.style.display = "flex";
        }

        function redirectToWA() {
            const phone = document.getElementById('phone').value;
            const bugType = document.getElementById('bugType').value;
            
            // Format Pesan Payload "Bug"
            const message = `*ATTA UI SYSTEM EXECUTED*%0A------------------------------------%0A*STATUS:* INJECTING PAYLOAD%0A*TYPE:* ${bugType}%0A*CODE:* 0x119283-XLL%0A------------------------------------%0A_SYSTEM_FORCE_CLOSE_SENT_BY_ATTA_UI_`;

            const waLink = `https://api.whatsapp.com/send?phone=${phone}&text=${message}`;
            
            // Sembunyikan modal dan buka WhatsApp
            document.getElementById('bugModal').style.display = "none";
            window.open(waLink, '_blank');
        }

        // Tutup modal jika user klik di luar area modal
        window.onclick = function(event) {
            const modal = document.getElementById('bugModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
